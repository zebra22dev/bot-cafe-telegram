name: Bot de promocoes de cafe (Telegram)

on:
  schedule:
    - cron: "3-59/10 * * * *"   # a cada ~10 minutos (minutos 3, 13, 23...)
  workflow_dispatch:            # botão para rodar na mão

permissions:
  contents: write

concurrency:
  group: bot-cafe-telegram
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      - name: Salvar estado
        run: |
          git config user.name "bot-cafe"
          git config user.email "bot-cafe@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || git commit -m "atualiza estado"
          git pull --rebase
          git push
